[project]
name = "onebot11-server"
version = "2.0.0"
description = "自写 OneBot 11 WebSocket 服务器，对接 LLOneBot，支持 Mixin + Extension 热加载"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "websockets>=11.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
